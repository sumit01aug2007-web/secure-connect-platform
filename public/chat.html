
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Connect | Live Chat</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }

    .chat {
      width: min(550px, 94%);
      background: #1e293b;
      padding: 24px;
      border-radius: 14px;
    }

    h2 { margin-top: 0; }

    input, button {
      padding: 12px;
      border: 0;
      border-radius: 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      margin: 7px 0;
      background: #334155;
      color: white;
    }

    button {
      cursor: pointer;
      background: #2563eb;
      color: white;
      margin: 5px 0;
    }

    button:disabled { opacity: .5; cursor: not-allowed; }

    #messages {
      height: 260px;
      overflow-y: auto;
      background: #0f172a;
      border-radius: 8px;
      padding: 12px;
      margin: 15px 0;
    }

    .message {
      padding: 9px;
      margin: 7px 0;
      background: #334155;
      border-radius: 7px;
      overflow-wrap: anywhere;
    }

    .system { color: #94a3b8; font-style: italic; }
    #status { color: #fbbf24; font-size: 13px; }
    .send { display: flex; gap: 8px; }
    .send input { flex: 1; }
    .send button { white-space: nowrap; }
  </style>
</head>

<body>
  <div class="chat">
    <h2>Secure Connect Chat</h2>
    <p id="status">Disconnected</p>

    <input id="token" type="password"
      placeholder="Paste your JWT token">

    <button id="connectBtn" onclick="connectChat()">
      Connect
    </button>

    <hr>

    <input id="room" value="general"
      placeholder="Enter room name">

    <button id="joinBtn" onclick="joinRoom()" disabled>
      Join Room
    </button>

    <div id="messages"></div>

    <div class="send">
      <input id="message" placeholder="Type your message..."
        disabled>
      <button id="sendBtn" onclick="sendMessage()" disabled>
        Send
      </button>
    </div>
  </div>

  <script>
    let socket = null;
    let joinedRoom = "";

    const status = document.getElementById("status");
    const messages = document.getElementById("messages");
    const tokenInput = document.getElementById("token");
    const roomInput = document.getElementById("room");
    const messageInput = document.getElementById("message");
    const joinBtn = document.getElementById("joinBtn");
    const sendBtn = document.getElementById("sendBtn");
    const connectBtn = document.getElementById("connectBtn");

    function addMessage(text, className = "message") {
      const div = document.createElement("div");
      div.className = className;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function connectChat() {
      const token = tokenInput.value.trim();

      if (!token) {
        alert("Please enter your JWT token.");
        return;
      }

      if (socket) socket.disconnect();

      socket = io({
        auth: { token }
      });

      socket.on("connect", () => {
        status.textContent = "Connected: " + socket.id;
        status.style.color = "#4ade80";
        joinBtn.disabled = false;
        connectBtn.disabled = true;
        addMessage("Connected to Secure Connect server.", "system");
      });

      socket.on("connect_error", (error) => {
        status.textContent = "Connection failed: " + error.message;
        status.style.color = "#f87171";
        connectBtn.disabled = false;
      });

      socket.on("chat:system", (data) => {
        addMessage(data.message, "system");
      });

      socket.on("chat:message", (data) => {
        addMessage(
          data.sender.username + ": " + data.message
        );
      });

      socket.on("disconnect", () => {
        status.textContent = "Disconnected";
        joinBtn.disabled = true;
        sendBtn.disabled = true;
        messageInput.disabled = true;
        connectBtn.disabled = false;
        joinedRoom = "";
      });
    }

    function joinRoom() {
      const room = roomInput.value.trim();

      if (!socket || !socket.connected) return;

      socket.emit("chat:join", room, (response) => {
        if (!response.ok) {
          alert(response.message);
          return;
        }

        joinedRoom = response.room;
        addMessage("You joined room: " + joinedRoom, "system");
        messageInput.disabled = false;
        sendBtn.disabled = false;
      });
    }

    function sendMessage() {
      const message = messageInput.value.trim();

      if (!message || !joinedRoom) return;

      socket.emit("chat:message", {
        room: joinedRoom,
        message: message
      }, (response) => {
        if (!response.ok) {
          alert(response.message);
          return;
        }

        messageInput.value = "";
      });
    }

    messageInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
